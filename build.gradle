import java.security.MessageDigest

plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'org.jlinalg'
version = '0.1.0-SNAPSHOT'

def jdistlibVersion = '0.10.1'
def jdistlibSha256 = 'c1912e1d10928a0df321c33c85d5f97b3921e40e9bbbdcddfc508358dfb2af03'
def jdistlibJar = layout.buildDirectory.file(
    "dependencies/jdistlib-all-${jdistlibVersion}.jar")

repositories {
    mavenCentral()
}

java {
    withSourcesJar()
    withJavadocJar()
}

sourceSets {
    main {
        resources.srcDir layout.buildDirectory.dir(
            'generated-resources/cholmod')
    }
    benchmark {
        java.srcDir 'src/benchmark/java'
        compileClasspath += sourceSets.main.output + configurations.testRuntimeClasspath
        runtimeClasspath += output + compileClasspath
    }
}

def cholmodSourceDir = layout.projectDirectory.dir('src/main/native/cholmod')
def cholmodBuildDir = layout.buildDirectory.dir('native/cholmod')
def cholmodResourceDir = layout.buildDirectory.dir(
    'generated-resources/cholmod')
def nativeOs = System.getProperty('os.name').toLowerCase(Locale.ROOT)
def nativeArchName = System.getProperty('os.arch').toLowerCase(Locale.ROOT)
def nativePlatform = nativeOs.contains('win') ? 'windows'
    : nativeOs.contains('mac') ? 'macos' : 'linux'
def nativeMachine = ['amd64', 'x86_64'].contains(nativeArchName)
    ? 'x86_64' : ['aarch64', 'arm64'].contains(nativeArchName)
        ? 'arm64' : nativeArchName
def cholmodLibraryName = nativePlatform == 'windows'
    ? 'jlinalg_cholmod.dll' : nativePlatform == 'macos'
        ? 'libjlinalg_cholmod.dylib' : 'libjlinalg_cholmod.so'
def environmentMklRoot = System.getenv('MKLROOT')
def detectedMklRoot = environmentMklRoot != null
        && file(environmentMklRoot).isDirectory()
    ? environmentMklRoot
    : file('C:/Program Files (x86)/Intel/oneAPI/mkl/2023.1.0').isDirectory()
        ? 'C:/Program Files (x86)/Intel/oneAPI/mkl/2023.1.0' : null
def configuredMklRoot = providers.gradleProperty('cholmodMklRoot')
    .getOrElse(detectedMklRoot)
def configuredSuiteSparse = providers.gradleProperty('suiteSparseSourceDir')
    .getOrNull()
def cholmodConfigureCommand = [
    'cmake', '-S', cholmodSourceDir.asFile.absolutePath,
    '-B', cholmodBuildDir.get().asFile.absolutePath,
    '-DCMAKE_BUILD_TYPE=Release'
]
if (configuredMklRoot != null && !configuredMklRoot.isBlank())
    cholmodConfigureCommand.add(
        "-DJLINALG_MKL_ROOT=${configuredMklRoot}")
if (configuredSuiteSparse != null && !configuredSuiteSparse.isBlank())
    cholmodConfigureCommand.add(
        "-DFETCHCONTENT_SOURCE_DIR_SUITESPARSE=${configuredSuiteSparse}")

tasks.register('configureCholmodNative', Exec) {
    group = 'build setup'
    description = 'Configures the pinned SuiteSparse CHOLMOD JNI bridge.'
    inputs.dir(cholmodSourceDir)
    inputs.property('mklRoot', configuredMklRoot ?: '')
    inputs.property('suiteSparseSource', configuredSuiteSparse ?: '')
    outputs.file(cholmodBuildDir.map { it.file('CMakeCache.txt') })
    commandLine cholmodConfigureCommand
}

tasks.register('buildCholmodNative', Exec) {
    group = 'build'
    description = 'Builds the SuiteSparse CHOLMOD JNI bridge for this host.'
    dependsOn tasks.named('configureCholmodNative')
    inputs.file(cholmodSourceDir.file('cholmod_jni.c'))
    outputs.file(cholmodBuildDir.map {
        it.file("bin/Release/${cholmodLibraryName}")
    })
    commandLine 'cmake', '--build', cholmodBuildDir.get().asFile.absolutePath,
        '--config', 'Release', '--target', 'jlinalg_cholmod', '--parallel'
}

tasks.register('packageCholmodNative', Sync) {
    group = 'build'
    description = 'Stages the host CHOLMOD JNI library as a classpath resource.'
    dependsOn tasks.named('buildCholmodNative')
    from(cholmodBuildDir.map { it.dir('bin') }) {
        include "**/${cholmodLibraryName}"
        eachFile { details -> details.path = details.name }
        includeEmptyDirs = false
    }
    into(cholmodResourceDir.map {
        it.dir("native/${nativePlatform}-${nativeMachine}")
    })
}

tasks.register('nativeCholmodJar', Jar) {
    group = 'build'
    description = 'Builds a platform-specific CHOLMOD native resource JAR.'
    dependsOn tasks.named('packageCholmodNative')
    archiveClassifier = "cholmod-${nativePlatform}-${nativeMachine}"
    from cholmodResourceDir
}

dependencies {
    api files(jdistlibJar)
    api 'com.github.samtools:htsjdk:5.0.0'
    api 'com.github.luben:zstd-jni:1.5.7-16'

    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.register('fetchJdistlib') {
    group = 'build setup'
    description = 'Downloads and verifies the pinned JDistlib release.'
    outputs.file(jdistlibJar)

    doLast {
        File destination = jdistlibJar.get().asFile
        destination.parentFile.mkdirs()

        def digest = { File file ->
            MessageDigest md = MessageDigest.getInstance('SHA-256')
            file.withInputStream { input ->
                byte[] buffer = new byte[8192]
                for (int count = input.read(buffer); count >= 0;
                     count = input.read(buffer)) {
                    if (count > 0) md.update(buffer, 0, count)
                }
            }
            md.digest().collect { String.format('%02x', it & 0xff) }.join('')
        }

        if (destination.isFile() && digest(destination) == jdistlibSha256) {
            return
        }

        File temporary = new File(destination.parentFile,
            destination.name + '.download')
        temporary.delete()
        new URI("https://github.com/robbyjo/JDistlib/releases/download/" +
            "v${jdistlibVersion}/jdistlib-all-${jdistlibVersion}.jar")
            .toURL().withInputStream { input ->
                temporary.withOutputStream { output -> output << input }
            }

        String actual = digest(temporary)
        if (actual != jdistlibSha256) {
            temporary.delete()
            throw new GradleException(
                "JDistlib checksum mismatch: expected ${jdistlibSha256}, got ${actual}")
        }
        java.nio.file.Files.move(temporary.toPath(), destination.toPath(),
            java.nio.file.StandardCopyOption.REPLACE_EXISTING,
            java.nio.file.StandardCopyOption.ATOMIC_MOVE)
    }
}

tasks.withType(JavaCompile).configureEach {
    dependsOn tasks.named('fetchJdistlib')
    options.encoding = 'UTF-8'
    options.release = 17
    options.compilerArgs += ['-Xlint:all', '-Werror']
}

tasks.withType(Javadoc).configureEach {
    dependsOn tasks.named('fetchJdistlib')
    options.encoding = 'UTF-8'
    options.addStringOption('Xdoclint:none', '-quiet')
    exclude 'org/jlinalg/internal/**'
}

test {
