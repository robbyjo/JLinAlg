    description = 'Runs deterministic GWAS/TWAS association macrobenchmarks.'
    dependsOn tasks.named('benchmarkClasses')
    classpath = sourceSets.benchmark.runtimeClasspath
    mainClass = 'org.jlinalg.benchmark.AssociationBenchmark'
    jvmArgs '-Xms1g', '-Xmx4g'
    systemProperties System.properties.findAll { key, ignored ->
        key.toString().startsWith('jlinalg.benchmark.')
