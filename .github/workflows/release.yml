name: Publish tagged release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to verify and publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Resolve release tag
        id: release_tag
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            RELEASE_TAG="$GITHUB_REF_NAME"
          else
            RELEASE_TAG="$REQUESTED_TAG"
          fi
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid release tag"; exit 1; }
          git rev-parse --verify "refs/tags/$RELEASE_TAG"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          git checkout --detach "refs/tags/$RELEASE_TAG"
      - name: Verify tag matches project version
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          grep -Fx "version = '${VERSION}'" build.gradle
      - name: Build and verify release
        run: bash ./gradlew clean check assemble
      - name: Prepare release assets and notes
        env:
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
        run: |
          mkdir -p build/release
          VERSION="${RELEASE_TAG#v}"
          cp "build/cli/jlinalg-$VERSION.jar" build/release/
          cp "build/libs/JLinAlg-$VERSION.jar" "build/release/JLinAlg-$VERSION-library.jar"
          cp "build/libs/JLinAlg-$VERSION-sources.jar" "build/libs/JLinAlg-$VERSION-javadoc.jar" build/release/
          (cd build/release && sha256sum *.jar > SHA256SUMS.txt)
          awk 'BEGIN {sections=0} /^# / {sections++; if(sections>1) exit} {print}' RELEASE_NOTES.md > build/release-notes.md
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refusing to overwrite published assets"
            exit 1
          else
            gh release create "$RELEASE_TAG" \
              build/release/* \
              --verify-tag \
              --title "JLinAlg $RELEASE_TAG" \
              --notes-file build/release-notes.md
          fi
